<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>感冒院 · 默认入口</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: oklch(18% 0.012 255);
        --surface: oklch(22% 0.014 255);
        --fg: oklch(94% 0.004 240);
        --muted: oklch(70% 0.014 240);
        --border: oklch(30% 0.012 245);
        --accent: oklch(70% 0.14 146);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100vh;
        border: 0;
        background: var(--bg);
      }

      .fallback {
        position: fixed;
        left: 16px;
        bottom: 16px;
        width: min(420px, calc(100vw - 32px));
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: color-mix(in oklch, var(--surface) 96%, var(--bg) 4%);
      }

      strong {
        display: block;
        margin-bottom: 6px;
        font-size: 16px;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <iframe src="workspace-home.html" title="感冒院 · 启动页" data-od-id="default-workspace-preview"></iframe>
    <noscript>
      <main class="fallback" data-od-id="entry-fallback">
        <strong>正在进入感冒院</strong>
        <p><a href="workspace-home.html">如果没有自动显示，请点击这里。</a></p>
      </main>
    </noscript>
  </body>
</html>
