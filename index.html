<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>感冒院</title>
    <meta name="description" content="感冒院前端工程壳 v0.1" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #171c22;
        --surface: #20262d;
        --fg: #eef2f5;
        --muted: #9ca8b3;
        --border: #313943;
        --accent: #7cd7a3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, rgba(124, 215, 163, 0.08), transparent 32%), var(--bg);
        color: var(--fg);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .boot-fallback {
        width: min(560px, 100%);
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
      }

      .boot-fallback h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .boot-fallback p {
        margin: 0 0 10px;
        color: var(--muted);
      }

      .boot-fallback code {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback">
        <h1>感冒院正在启动</h1>
        <p>如果你现在看到的只有这个页面，通常说明项目还没有通过开发服务器启动。</p>
        <p>请在当前目录执行：<code>npm install</code> 和 <code>npm run dev</code>，然后打开终端里显示的本地地址。</p>
        <p>不要直接双击 <code>index.html</code> 打开。</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
