name: Windows package validation

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      validate_existing_run_id:
        description: "Optional prior Windows build run ID to validate its retained installer without rebuilding."
        required: false
        type: string
      expected_source_sha:
        description: "Required with validate_existing_run_id; must match that run's checked-out source SHA."
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build-and-validate:
    name: Build and test NSIS package on ephemeral Windows runner
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        if: ${{ !inputs.validate_existing_run_id }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify pinned Rust toolchain
        if: ${{ !inputs.validate_existing_run_id }}
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          rustup show active-toolchain
          rustc --version

      - name: Install locked frontend dependencies
        if: ${{ !inputs.validate_existing_run_id }}
        run: npm.cmd ci --no-audit --no-fund

      - name: Frontend tests
        if: ${{ !inputs.validate_existing_run_id }}
        run: npm.cmd test

      - name: Frontend production build
        if: ${{ !inputs.validate_existing_run_id }}
        run: npm.cmd run build

      - name: Rust formatting
        if: ${{ !inputs.validate_existing_run_id }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust unit tests
        if: ${{ !inputs.validate_existing_run_id }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\ganmaoyuan-cargo-target
          GANMAOYUAN_TEST_ROOT: ${{ runner.temp }}\ganmaoyuan-tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build NSIS package and provenance
        if: ${{ !inputs.validate_existing_run_id }}
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\ganmaoyuan-cargo-target
        run: |
          ./scripts/build-windows-release.ps1 -OutputDirectory "$env:RUNNER_TEMP\ganmaoyuan-release" -RequireCleanTree

      - name: Download retained package for validation-only run
        if: ${{ inputs.validate_existing_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: ganmaoyuan-windows-${{ inputs.expected_source_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.validate_existing_run_id }}
          path: ${{ runner.temp }}\ganmaoyuan-release

      - name: Download and verify the last public installer as upgrade baseline
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP "Ganmaoyuan_0.1.1_x64-setup.exe"
          $expected = "05D32A3D2E90D4F86740494561DF0CF4804A2E3C15DB0F45E55E731CA80622BC"
          Invoke-WebRequest `
            -Uri "https://github.com/2184369772-ai/Ganmaoyuan/releases/download/v0.1.1/Ganmaoyuan_0.1.1_x64-setup.exe" `
            -OutFile $baseline
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $baseline).Hash.ToUpperInvariant()
          if ($actual -ne $expected) { throw "The public v0.1.1 baseline installer SHA-256 did not match its pinned digest." }

      - name: Validate install, upgrade branch, shortcuts, startup, and uninstall
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_EXISTING_RUN_ID: ${{ inputs.validate_existing_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          $releaseDir = "$env:RUNNER_TEMP\ganmaoyuan-release"
          $record = Get-Content -Raw -Encoding UTF8 (Join-Path $releaseDir "build-provenance.json") | ConvertFrom-Json
          if ($env:VALIDATE_EXISTING_RUN_ID) {
            if ($env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw "Validation-only runs require an exact 40-character expected source SHA." }
            $sourceRun = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:VALIDATE_EXISTING_RUN_ID" `
              -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            if ($sourceRun.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $sourceRun.head_sha -ne $env:EXPECTED_SOURCE_SHA) {
              throw "The retained package run repository/SHA does not match the requested source identity."
            }
            $expectedSourceRevision = $env:EXPECTED_SOURCE_SHA
          } else {
            $expectedSourceRevision = $env:GITHUB_SHA
          }
          if ($record.sourceRevision -ne $expectedSourceRevision) { throw "The installer provenance does not match the verified source revision." }
          if (-not $record.workingTreeClean) { throw "The release artifact was not built from a clean working tree." }
          $appArtifact = Join-Path $releaseDir $record.appFile
          $actualAppArtifactSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $appArtifact).Hash.ToUpperInvariant()
          if ($actualAppArtifactSha -ne $record.appSha256.ToUpperInvariant()) { throw "The retained standalone app binary does not match build provenance." }
          ./scripts/validate-windows-installer.ps1 `
            -InstallerPath (Join-Path $releaseDir $record.installerFile) `
            -EvidenceDirectory (Join-Path $releaseDir "validation-evidence") `
            -ExpectedSha256 $record.installerSha256 `
            -ExpectedAppSha256 $record.appSha256 `
            -ExpectedVersion $record.version `
            -BaselineInstallerPath (Join-Path $env:RUNNER_TEMP "Ganmaoyuan_0.1.1_x64-setup.exe") `
            -ExpectedBaselineSha256 "05D32A3D2E90D4F86740494561DF0CF4804A2E3C15DB0F45E55E731CA80622BC"
          $report = Get-Content -Raw -Encoding UTF8 (Join-Path $releaseDir "validation-evidence\install-validation.json") | ConvertFrom-Json
          if ($report.failure) { throw $report.failure }
          if (-not $report.checks -or @($report.checks | Where-Object { -not $_.passed }).Count -gt 0) { throw "One or more hosted install checks failed." }
          $record.installerValidation = "passed on ephemeral GitHub Actions Windows hosted runner; public v0.1.1 cross-release upgrade, process startup, and synthetic data preservation checked; interactive GUI not verified"
          $record.validationInstallerSha256 = $report.installerSha256
          $record | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 (Join-Path $releaseDir "build-provenance.json")
          @"
          ## Windows package acceptance
          - Installer SHA-256 matched the build provenance and validation input.
          - The v0.1.1 baseline installer was downloaded from the public release and matched its pinned SHA-256 before execution.
          - Silent clean install, `/UPDATE` reinstall, semantic-version branch, same-name shortcut preservation, v0.1.1-to-current cross-release upgrade, installed app hash, app process startup, managed shortcut cleanup, and synthetic app-data preservation were checked on an ephemeral Windows hosted runner.
          - Process startup is not GUI acceptance. Interactive GUI behavior was not verified.
          - The installer is unsigned unless the provenance explicitly says otherwise.
          "@ | Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY

      - name: Upload package and traceable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ganmaoyuan-windows-${{ github.sha }}
          path: ${{ runner.temp }}\ganmaoyuan-release\*
          if-no-files-found: warn
          retention-days: 30
